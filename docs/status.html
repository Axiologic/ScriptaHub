<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <script>try{const t=localStorage.getItem('scripta-site-theme');document.documentElement.dataset.theme=['light','orange','nord','dark','dark-orange'].includes(t)?t:'dark-orange'}catch{document.documentElement.dataset.theme='dark-orange'}</script>
  <title>Animation voice migration status</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .status-page{max-width:1180px;margin:0 auto;padding:48px clamp(20px,4vw,64px) 80px}.status-page h1{margin:0;font-size:clamp(2rem,5vw,3.5rem)}.status-page>p{max-width:72ch;color:var(--muted,#6d7475);font-size:1.05rem}.status-updated{margin:32px 0 20px}.status-counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.status-counts div,.status-group{background:var(--surface,#fff);border:1px solid color-mix(in srgb,var(--ink,#172725) 14%,transparent);border-radius:14px}.status-counts div{padding:18px}.status-counts strong{display:block;font-size:2rem;line-height:1;color:var(--accent,#ff7900)}.status-counts span{display:block;margin-top:8px;font-size:.85rem}.status-group{margin-top:26px;padding:20px}.status-group h2{margin:0 0 14px;font-size:1.22rem}.status-group h2 small{color:var(--muted,#6d7475);font-weight:400}.status-list{display:grid;gap:8px}.status-list article{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:14px 0;border-top:1px solid color-mix(in srgb,var(--ink,#172725) 12%,transparent)}.status-list article:first-child{border-top:0}.status-list h3{margin:0;font-size:1rem}.status-list p{margin:5px 0 0;color:var(--muted,#6d7475);font-size:.9rem}.status-actions{display:flex;gap:10px;white-space:nowrap}.status-actions a{font-size:.86rem;font-weight:700}.status-list details{grid-column:1/-1}.status-list summary{cursor:pointer;font-weight:700;font-size:.9rem}.status-list ol{margin:12px 0 0;padding-left:1.4rem;line-height:1.48}.status-list li+li{margin-top:4px}.status-plan{margin:10px 0;color:var(--muted,#6d7475);font-size:.9rem}.status-note{font-size:.9rem;color:var(--muted,#6d7475)}@media(max-width:580px){.status-page{padding-top:28px}.status-list article{display:flex;align-items:flex-start;flex-direction:column}.status-actions{padding-top:3px}}
    .status-list article[hidden],.status-group[hidden]{display:none}.status-list h4{margin:20px 0 8px}.status-scene h5{font-size:.95rem;margin:16px 0 0}.status-search{display:block;margin:28px 0 12px;font-weight:600}.status-search input{display:block;width:100%;margin-top:8px;padding:12px;background:var(--surface);color:var(--ink);border:1px solid var(--muted);border-radius:6px}.status-gate{padding:16px;background:var(--surface);border-left:3px solid #ff7900}.status-hook{padding-top:14px}.status-list details{min-width:0}.status-list article>div{min-width:0}.status-list h3{overflow-wrap:anywhere}
    .status-page{--status-orange:#b64b00;--status-line:rgba(182,75,0,.3)}
    :root[data-theme="dark"] .status-page,:root[data-theme="dark-orange"] .status-page{--status-orange:#ff942f;--status-line:rgba(255,148,47,.35)}
    .status-list h3{font-size:1.22rem;line-height:1.4}.status-page a,.status-list h3 a{color:var(--status-orange);text-decoration:none}.status-page a:hover{text-decoration:underline}.status-page a:focus-visible{outline:2px solid var(--status-orange);outline-offset:4px}.status-list article{padding:24px 0;border-top:2px solid var(--status-line)}.status-list{gap:12px}.status-list article:first-child{padding-top:10px}.status-list summary{color:var(--status-orange);padding:8px 0}.status-list details[open]{padding:0 16px 18px;border-left:3px solid var(--status-line);margin-top:8px}.status-list details[open] summary{padding-top:0}.status-list ol{max-width:78ch;line-height:1.7}.status-list li+li{margin-top:8px}.status-stages{line-height:1.7}.status-group{padding:24px}.status-active{border-color:var(--status-orange)}
    .status-list details[open]{background:#fff3e7;padding:16px 22px 24px;border:1px solid var(--status-line);border-left:4px solid var(--status-orange);border-radius:8px;margin:8px 0 12px;width:100%;box-sizing:border-box}
    :root[data-theme="dark"] .status-list details[open],:root[data-theme="dark-orange"] .status-list details[open]{background:#211b16}
    .status-list details[open] summary{padding:0 0 14px;border-bottom:1px solid var(--status-line);margin-bottom:12px}.status-list details[open] h4{color:var(--status-orange)}
    @media(max-width:580px){.status-list details[open]{padding:14px}.status-group{padding:16px}}
  </style>
</head>
<body data-app-page="true">
  <main class="status-page">
    <p class="status-note">Internal maintenance page · not linked from the public navigation</p>
    <h1>Book introduction revision</h1>
    <p>Review the exact narration and visual plans for every book. All texts are reviewed before voice conversion; published films remain visible through their own links.</p>
    <div data-voice-status aria-live="polite">Loading migration status…</div>
  </main>
  <script src="assets/voice-migration-status.js?v=curiosity-v2"></script>
  <script src="assets/status.js?v=curiosity-v2"></script>
</body>
</html>
