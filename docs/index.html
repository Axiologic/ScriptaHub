<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ScriptaHub: free, long-form books created with generative AI and improved through research and community feedback.">
  <title>ScriptaHub · Books worth revising</title>
  <script>try{if(localStorage.getItem("scripta-site-theme")==="dark")document.documentElement.dataset.theme="dark"}catch{}</script>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="index.html">ScriptaHub<span>.com</span></a>
      <div class="header-tools"><a class="header-create" data-create-link href="create/index.html?lang=en">Create</a><div class="site-scale" aria-label="Site text size"><button type="button" data-site-smaller aria-label="Decrease site size">A−</button><button type="button" data-site-size aria-label="Reset site size">100%</button><button type="button" data-site-larger aria-label="Increase site size">A+</button></div><div class="theme-switcher" role="group" aria-label="Appearance"><button type="button" data-theme-choice="light" aria-label="Light appearance">☼</button><button type="button" data-theme-choice="dark" aria-label="Dark appearance">◐</button></div><label class="language-picker"><span class="sr-only">Language</span><select data-language-select></select></label></div>
    </header>
    <section class="site-hero">
      <div class="hero-heading"><p class="eyebrow" data-hero-kicker>About</p><h1 data-hero-title>Books for the <em>long tail</em> of thought.</h1></div>
      <div class="hero-lead"><div class="lead" data-hero-lead></div></div>
    </section>
    <div class="discovery-mission" aria-busy="true">
      <div class="home-loading" data-home-loading role="status" aria-live="polite">
        <div class="home-loading-inner">
          <div class="home-loading-visual" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><i></i></div>
          <strong>ScriptaHub<span>.com</span></strong>
          <small data-home-loading-text>Loading the library…</small>
          <div class="home-loading-progress" aria-hidden="true"></div>
        </div>
      </div>
      <section class="discovery" aria-label="Keyword discovery"><div class="keyword-cloud" data-keyword-cloud aria-label="Keyword cloud"></div></section>
      <div class="mission-book-strip mission-featured-cover" data-mission-books></div>
      <article class="mission featured-book-card" data-featured-book aria-live="polite"></article>
    </div>
    <section class="keyword-browser" data-keyword-browser hidden aria-live="polite">
      <header class="keyword-header">
        <div>
          <p class="eyebrow" data-keyword-kicker>Keyword</p>
          <h2 data-keyword-title></h2>
          <p data-keyword-count></p>
        </div>
        <button class="keyword-clear" type="button" data-keyword-clear>Clear filter</button>
      </header>
      <div class="keyword-results" data-keyword-results></div>
    </section>
    <footer class="site-footer"><a class="footer-wordmark" href="index.html">ScriptaHub.com</a><nav aria-label="Legal"><a data-footer-terms data-legal-link href="legal/terms.html?lang=en">Terms</a><a data-footer-privacy data-legal-link href="legal/privacy.html?lang=en">Privacy</a><a data-footer-cookies data-legal-link href="legal/cookies.html?lang=en">Cookies &amp; local storage</a><a data-footer-notice data-legal-link href="legal/notice.html?lang=en">Legal notice</a><a data-footer-ai data-legal-link href="legal/ai.html?lang=en">AI transparency</a></nav><span class="footer-status">© 2026 ScriptaHub</span></footer>
  </main>
  <script src="collection.js"></script>
  <script src="assets/keyword-cloud.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
